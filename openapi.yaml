openapi: 3.0.0
info:
  title: API Mercado Negro de Emociones
  version: 1.0.0
  description: API para gestionar usuarios dentro del mercado de emociones

servers:
  - url: http://localhost:3000

paths:

  /usuarios:
    get:
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
        '400':
          description: Petición inválida
        '500':
          description: Error interno del servidor

    post:
      summary: Crear un nuevo usuario
      requestBody:
        required: true
      responses:
        '201':
          description: Usuario creado correctamente
        '400':
          description: Datos inválidos
        '500':
          description: Error interno del servidor

  /usuarios/{id}:
    get:
      summary: Obtener usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario encontrado
        '400':
          description: ID inválido
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor

    put:
      summary: Actualizar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario actualizado
        '400':
          description: Datos inválidos
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor

    delete:
      summary: Eliminar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario eliminado
        '400':
          description: ID inválido
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor

components:

  schemas:

    Usuario:
      type: object
      properties:
        nombre:
          type: string
          example: Oumniya
        email:
          type: string
          example: oum@email.com
        saldoEmocional:
          type: number
          example: 500
        estadoMental:
          type: string
          example: estable
        nivelRiesgo:
          type: number
          example: 5
        activo:
          type: boolean
          example: true
        fechaRegistro:
          type: string
          format: date-time