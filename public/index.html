<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Emotional Black Market
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="css/main.css"
  />

  <!-- CHART -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="login-page">

  <!-- BACKGROUND -->

  <div class="background-grid"></div>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- LOGIN CONTAINER -->

  <div class="login-container">

    <!-- LEFT PANEL -->

    <div class="login-left">

      <!-- LOGO -->

      <div class="logo">

        <h1>
          EBM
        </h1>

        <span>
          Emotional Black Market
        </span>

      </div>

      <!-- HERO -->

      <div class="hero-content">

        <h1 class="hero-title">

          Emotional Trading System

        </h1>

        <p class="hero-description">

          Monitor emotional volatility,
          neural transactions and underground
          psychological markets in real time.

        </p>

      </div>

      <!-- STATUS -->

      <div class="system-status">

        <span class="online-dot"></span>

        SYSTEM ONLINE

      </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="login-right">

      <div class="login-card">

        <!-- HEADER -->

        <div class="login-header">

          <h2>
            Access Market
          </h2>

          <p>
            Authenticate to continue
          </p>

        </div>

        <!-- FORM -->

        <form id="loginForm">

          <!-- USERNAME -->

          <div class="form-group">

            <label class="form-label">

              Username

            </label>

            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="Enter username"
              required
            />

          </div>

          <!-- PASSWORD -->

          <div class="form-group">

            <label class="form-label">

              Password

            </label>

            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter password"
              required
            />

          </div>

          <!-- BUTTON -->

          <button
            type="submit"
            class="btn btn-primary btn-full login-btn"
          >

            ACCESS SYSTEM

          </button>

        </form>

        <!-- FOOTER -->

        <div class="login-footer">

          <small>

            Emotional Market v1.0

          </small>

        </div>

      </div>

    </div>

  </div>

  <!-- JS -->

  <!-- CORE -->

  <script src="js/core/config.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/auth.js"></script>

  <!-- UI -->

  <script src="js/ui/toasts.js"></script>
  <script src="js/ui/loaders.js"></script>
  <script src="js/ui/modals.js"></script>
  <script src="js/ui/sidebar.js"></script>
  <script src="js/ui/app.js"></script>

  <!-- UTILS -->

  <script src="js/utils/constants.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/validators.js"></script>
  <script src="js/utils/formatters.js"></script>

</body>

</html>
