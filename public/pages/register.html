<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Register | EBM
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="/css/main.css"
  />

</head>

<body class="login-page">

  <!-- BACKGROUND -->

  <div class="background-grid"></div>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- CONTAINER -->

  <div class="login-container">

    <!-- LEFT PANEL -->

    <div class="login-left">

      <div class="logo">

        <h1>
          EBM
        </h1>

        <span>
          Emotional Black Market
        </span>

      </div>

      <div class="hero-content">

        <h1 class="hero-title">

          Create Your Identity

        </h1>

        <p class="hero-description">

          Join the underground emotional
          trading network and access
          psychological market systems.

        </p>

      </div>

      <div class="system-status">

        <span class="online-dot"></span>

        REGISTRATION OPEN

      </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="login-right">

      <div class="login-card">

        <!-- HEADER -->

        <div class="login-header">

          <h2>
            Create Account
          </h2>

          <p>
            Join Emotional Market
          </p>

        </div>

        <!-- FORM -->

        <form id="registerForm">

          <!-- NAME -->

          <div class="form-group">

            <label class="form-label">

              Name

            </label>

            <input
              type="text"
              id="nombre"
              class="form-input"
              placeholder="Enter your name"
              required
            />

          </div>

          <!-- EMAIL -->

          <div class="form-group">

            <label class="form-label">

              Email

            </label>

            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="Enter email"
              required
            />

          </div>

          <!-- PASSWORD -->

          <div class="form-group">

            <label class="form-label">

              Password

            </label>

            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Enter password"
              required
            />

          </div>

          <!-- BUTTON -->

          <button
            type="submit"
            class="btn btn-primary btn-full login-btn"
          >

            CREATE ACCOUNT

          </button>

          <!-- LOGIN LINK -->

          <p
            style="
              margin-top: 20px;
              text-align: center;
              color: #9ca3af;
            "
          >

            Already have an account?

            <a
              href="/index.html"
              style="
                color: #00f5ff;
                text-decoration: none;
                margin-left: 5px;
              "
            >

              Login

            </a>

          </p>

        </form>

        <!-- FOOTER -->

        <div class="login-footer">

          <small>

            Emotional Market v1.0

          </small>

        </div>

      </div>

    </div>

  </div>

  <!-- JS -->

  <script src="/js/pages/register.js"></script>

</body>

</html>
