<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Admin | Emotional Black Market
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  />

</head>

<body>

  <!-- BACKGROUND -->

  <div class="background-grid"></div>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- APP -->

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">

        <h1>
          EBM
        </h1>

        <span>
          Emotional Black Market
        </span>

      </div>

      <!-- NAV -->

      <nav>

        <a href="./dashboard.html">
          Dashboard
        </a>

        <a href="./users.html">
          Users
        </a>

        <a href="./emotions.html">
          Emotions
        </a>

        <a href="./transactions.html">
          Transactions
        </a>

        <a href="./analytics.html">
          Analytics
        </a>

        <a
          href="./admin.html"
          class="active"
        >
          Admin
        </a>

      </nav>

      <!-- STATUS -->

      <div class="system-status">

        <span class="online-dot"></span>

        SYSTEM ONLINE

      </div>

      <!-- LOGOUT -->

      <button
        class="btn btn-danger btn-full"
        onclick="logout()"
      >

        Logout

      </button>

    </aside>

    <!-- CONTENT -->

    <main class="page-content">

      <!-- HEADER -->

      <div class="admin-header">

        <div>

          <h1 class="page-title">
            Admin Control Center
          </h1>

          <p class="page-description">

            Monitor infrastructure,
            server status and platform health.

          </p>

        </div>

      </div>

      <!-- STATUS GRID -->

      <section class="status-grid">

        <!-- SERVER -->

        <div class="card status-card">

          <small>
            Server Status
          </small>

          <div
            id="serverStatus"
            class="status-value"
          >

            OFFLINE

          </div>

        </div>

        <!-- DATABASE -->

        <div class="card status-card">

          <small>
            Database
          </small>

          <div
            id="databaseStatus"
            class="status-value"
          >

            DISCONNECTED

          </div>

        </div>

        <!-- REQUESTS -->

        <div class="card status-card">

          <small>
            API Requests
          </small>

          <div
            id="apiRequests"
            class="status-value"
          >

            0

          </div>

        </div>

        <!-- SESSIONS -->

        <div class="card status-card">

          <small>
            Active Sessions
          </small>

          <div
            id="activeSessions"
            class="status-value"
          >

            0

          </div>

        </div>

      </section>

      <!-- SYSTEM STATUS -->

      <section class="page-section">

        <div
          id="systemStatusContainer"
        ></div>

      </section>

      <!-- LOGS -->

      <section class="card logs-panel">

        <div class="card-header">

          <h3 class="card-title">

            System Logs

          </h3>

        </div>

        <div
          id="logsContainer"
          class="logs-container"
        ></div>

      </section>

    </main>

  </div>

  <!-- JS -->

  <!-- CORE -->

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>

  <!-- UI -->

  <script src="../js/ui/toasts.js"></script>
  <script src="../js/ui/loaders.js"></script>
  <script src="../js/ui/modals.js"></script>
  <script src="../js/ui/sidebar.js"></script>
  <script src="../js/ui/app.js"></script>

  <!-- SERVICES -->

  <script src="../js/services/analytics.service.js"></script>

  <!-- UTILS -->

  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>

  <!-- PAGE -->

  <script src="../js/pages/admin.js"></script>

</body>

</html>
