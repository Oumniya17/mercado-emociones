<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Users | Emotional Black Market
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  />

</head>

<body>

  <!-- BACKGROUND -->

  <div class="background-grid"></div>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- APP -->

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <!-- LOGO -->

      <div class="logo">

        <h1>
          EBM
        </h1>

        <span>
          Emotional Black Market
        </span>

      </div>

      <!-- NAV -->

      <nav>

        <a href="./dashboard.html">
          Dashboard
        </a>

        <a
          href="./users.html"
          class="active"
        >
          Users
        </a>

        <a href="./emotions.html">
          Emotions
        </a>

        <a href="./transactions.html">
          Transactions
        </a>

        <a href="./analytics.html">
          Analytics
        </a>

        <a href="./admin.html">
          Admin
        </a>

      </nav>

      <!-- STATUS -->

      <div class="system-status">

        <span class="online-dot"></span>

        SYSTEM ONLINE

      </div>

      <!-- LOGOUT -->

      <button
        class="btn btn-danger btn-full"
        onclick="logout()"
      >

        Logout

      </button>

    </aside>

    <!-- CONTENT -->

    <main class="page-content">

      <!-- HEADER -->

      <div class="users-header">

        <div>

          <h1 class="page-title">
            Users
          </h1>

          <p class="page-description">

            Manage emotional traders,
            neural accounts and market users.

          </p>

        </div>

        <button
          class="btn btn-primary"
          onclick="openModal('createUserModal')"
        >

          Create User

        </button>

      </div>

      <!-- FILTERS -->

      <section class="page-section">

        <input
          type="text"
          id="searchUsers"
          class="form-input search-input"
          placeholder="Search users..."
        />

      </section>

      <!-- TABLE -->

      <section class="card">

        <div class="table-wrapper">

          <table class="table">

            <thead>

              <tr>

                <th>
                  User
                </th>

                <th>
                  Email
                </th>

                <th>
                  Balance
                </th>

                <th>
                  Role
                </th>

                <th>
                  Actions
                </th>

              </tr>

            </thead>

            <tbody
              id="usersTableBody"
            ></tbody>

          </table>

        </div>

      </section>

    </main>

  </div>

  <!-- CREATE USER MODAL -->

  <div
    id="createUserModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <!-- HEADER -->

      <div class="modal-header">

        <h2 class="modal-title">

          Create User

        </h2>

        <button
          class="modal-close"
          onclick="closeModal('createUserModal')"
        >

          ✕

        </button>

      </div>

      <!-- FORM -->

      <form id="createUserForm">

        <!-- NAME -->

        <div class="form-group">

          <label class="form-label">

            Name

          </label>

          <input
            type="text"
            id="userName"
            class="form-input"
            placeholder="Enter user name"
            required
          />

        </div>

        <!-- EMAIL -->

        <div class="form-group">

          <label class="form-label">

            Email

          </label>

          <input
            type="email"
            id="userEmail"
            class="form-input"
            placeholder="Enter email"
            required
          />

        </div>

        <!-- BALANCE -->

        <div class="form-group">

          <label class="form-label">

            Emotional Balance

          </label>

          <input
            type="number"
            id="userBalance"
            class="form-input"
            placeholder="Enter balance"
            required
          />

        </div>

        <!-- FOOTER -->

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            onclick="closeModal('createUserModal')"
          >

            Cancel

          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >

            Create User

          </button>

        </div>

      </form>

    </div>

  </div>

  <!-- JS -->

  <!-- CORE -->

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>

  <!-- UI -->

  <script src="../js/ui/toasts.js"></script>
  <script src="../js/ui/loaders.js"></script>
  <script src="../js/ui/modals.js"></script>
  <script src="../js/ui/sidebar.js"></script>
  <script src="../js/ui/app.js"></script>

  <!-- SERVICES -->

  <script src="../js/services/users.service.js"></script>

  <!-- UTILS -->

  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>

  <!-- PAGE -->

  <script src="../js/pages/users.js"></script>

</body>

</html>
