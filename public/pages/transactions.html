<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Transactions | Emotional Black Market
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  />

</head>

<body>

  <!-- BACKGROUND -->

  <div class="background-grid"></div>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- APP -->

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">

        <h1>
          EBM
        </h1>

        <span>
          Emotional Black Market
        </span>

      </div>

      <nav>

        <a href="./dashboard.html">
          Dashboard
        </a>

        <a href="./users.html">
          Users
        </a>

        <a href="./emotions.html">
          Emotions
        </a>

        <a
          href="./transactions.html"
          class="active"
        >
          Transactions
        </a>

        <a href="./analytics.html">
          Analytics
        </a>

        <a href="./admin.html">
          Admin
        </a>

      </nav>

      <div class="system-status">

        <span class="online-dot"></span>

        SYSTEM ONLINE

      </div>

      <button
        class="btn btn-danger btn-full"
        onclick="logout()"
      >

        Logout

      </button>

    </aside>

    <!-- CONTENT -->

    <main class="page-content">

      <!-- HEADER -->

      <div class="transactions-header">

        <div>

          <h1 class="page-title">
            Transactions
          </h1>

          <p class="page-description">

            Execute emotional trades and monitor
            neural market operations.

          </p>

        </div>

      </div>

      <!-- GRID -->

      <section class="transactions-grid">

        <!-- TRADING PANEL -->

        <div class="card trading-panel">

          <div class="card-header">

            <h3 class="card-title">

              Trading Terminal

            </h3>

          </div>

          <!-- FORM -->

          <form id="createTransactionForm">

            <!-- USER -->

            <div class="form-group">

              <label class="form-label">

                User

              </label>

              <select
                id="transactionUser"
                class="form-select"
                required
              ></select>

            </div>

            <!-- EMOTION -->

            <div class="form-group">

              <label class="form-label">

                Emotion

              </label>

              <select
                id="transactionEmotion"
                class="form-select"
                required
              ></select>

            </div>

            <!-- AMOUNT -->

            <div class="form-group">

              <label class="form-label">

                Amount

              </label>

              <input
                type="number"
                id="transactionAmount"
                class="form-input"
                placeholder="Enter amount"
                required
              />

            </div>

            <!-- BUTTON -->

            <button
              type="submit"
              class="btn btn-primary btn-full"
            >

              Execute Transaction

            </button>

          </form>

        </div>

        <!-- HISTORY -->

        <div class="card history-panel">

          <div class="card-header">

            <h3 class="card-title">

              Transaction History

            </h3>

          </div>

          <!-- TABLE -->

          <div class="table-wrapper">

            <table class="table">

              <thead>

                <tr>

                  <th>
                    User
                  </th>

                  <th>
                    Emotion
                  </th>

                  <th>
                    Amount
                  </th>

                  <th>
                    Total
                  </th>

                  <th>
                    Status
                  </th>

                  <th>
                    Date
                  </th>

                </tr>

              </thead>

              <tbody
                id="transactionsTableBody"
              ></tbody>

            </table>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- JS -->

  <!-- CORE -->

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>

  <!-- UI -->

  <script src="../js/ui/toasts.js"></script>
  <script src="../js/ui/loaders.js"></script>
  <script src="../js/ui/modals.js"></script>
  <script src="../js/ui/sidebar.js"></script>
  <script src="../js/ui/app.js"></script>

  <!-- SERVICES -->

  <script src="../js/services/users.service.js"></script>
  <script src="../js/services/emotions.service.js"></script>
  <script src="../js/services/transactions.service.js"></script>

  <!-- UTILS -->

  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>

  <!-- PAGE -->

  <script src="../js/pages/transactions.js"></script>

</body>

</html>
