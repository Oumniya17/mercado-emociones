<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Emotions | Emotional Black Market
  </title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="../css/main.css"
  />

</head>

<body>

  <!-- BACKGROUND -->

  <div class="background-grid"></div>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- APP -->

  <div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="logo">

        <h1>
          EBM
        </h1>

        <span>
          Emotional Black Market
        </span>

      </div>

      <nav>

        <a href="./dashboard.html">
          Dashboard
        </a>

        <a href="./users.html">
          Users
        </a>

        <a
          href="./emotions.html"
          class="active"
        >
          Emotions
        </a>

        <a href="./transactions.html">
          Transactions
        </a>

        <a href="./analytics.html">
          Analytics
        </a>

        <a href="./admin.html">
          Admin
        </a>

      </nav>

      <div class="system-status">

        <span class="online-dot"></span>

        SYSTEM ONLINE

      </div>

      <button
        class="btn btn-danger btn-full"
        onclick="logout()"
      >

        Logout

      </button>

    </aside>

    <!-- CONTENT -->

    <main class="page-content">

      <!-- HEADER -->

      <div class="market-header">

        <div>

          <h1 class="page-title">
            Emotional Market
          </h1>

          <p class="page-description">

            Trade emotional assets and monitor
            psychological market fluctuations.

          </p>

        </div>

        <button
          class="btn btn-primary"
          onclick="openModal('createEmotionModal')"
        >

          Create Emotion

        </button>

      </div>

      <!-- SEARCH -->

      <section class="page-section">

        <input
          type="text"
          id="searchEmotions"
          class="form-input search-input"
          placeholder="Search emotions..."
        />

      </section>

      <!-- MARKET GRID -->

      <section
        id="emotionsGrid"
        class="market-grid"
      ></section>

    </main>

  </div>

  <!-- CREATE MODAL -->

  <div
    id="createEmotionModal"
    class="modal hidden"
  >

    <div class="modal-content">

      <!-- HEADER -->

      <div class="modal-header">

        <h2 class="modal-title">

          Create Emotion

        </h2>

        <button
          class="modal-close"
          onclick="closeModal('createEmotionModal')"
        >

          ✕

        </button>

      </div>

      <!-- FORM -->

      <form id="createEmotionForm">

        <!-- NAME -->

        <div class="form-group">

          <label class="form-label">

            Emotion Name

          </label>

          <input
            type="text"
            id="emotionName"
            class="form-input"
            placeholder="Enter emotion name"
            required
          />

        </div>

        <!-- DESCRIPTION -->

        <div class="form-group">

          <label class="form-label">

            Description

          </label>

          <textarea
            id="emotionDescription"
            class="form-textarea"
            placeholder="Enter emotion description"
          ></textarea>

        </div>

        <!-- INTENSITY -->

        <div class="form-group">

          <label class="form-label">

            Intensity

          </label>

          <input
            type="number"
            id="emotionIntensity"
            class="form-input"
            placeholder="Enter intensity"
            required
          />

        </div>

        <!-- PRICE -->

        <div class="form-group">

          <label class="form-label">

            Base Price

          </label>

          <input
            type="number"
            id="emotionPrice"
            class="form-input"
            placeholder="Enter base price"
            required
          />

        </div>

        <!-- VOLATILITY -->

        <div class="form-group">

          <label class="form-label">

            Volatility %

          </label>

          <input
            type="number"
            id="emotionVolatility"
            class="form-input"
            placeholder="Enter volatility"
          />

        </div>

        <!-- FOOTER -->

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            onclick="closeModal('createEmotionModal')"
          >

            Cancel

          </button>

          <button
            type="submit"
            class="btn btn-primary"
          >

            Create Emotion

          </button>

        </div>

      </form>

    </div>

  </div>

  <!-- JS -->

  <!-- CORE -->

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/api.js"></script>
  <script src="../js/core/auth.js"></script>

  <!-- UI -->

  <script src="../js/ui/toasts.js"></script>
  <script src="../js/ui/loaders.js"></script>
  <script src="../js/ui/modals.js"></script>
  <script src="../js/ui/sidebar.js"></script>
  <script src="../js/ui/app.js"></script>

  <!-- SERVICES -->

  <script src="../js/services/emotions.service.js"></script>

  <!-- UTILS -->

  <script src="../js/utils/constants.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/utils/formatters.js"></script>

  <!-- PAGE -->

  <script src="../js/pages/emotions.js"></script>

</body>

</html>
