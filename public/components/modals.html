<!-- GLOBAL MODAL -->

<div
  id="globalModal"
  class="modal hidden"
>

  <div class="modal-content">

    <!-- HEADER -->

    <div class="modal-header">

      <h2
        id="modalTitle"
        class="modal-title"
      >

        Modal Title

      </h2>

      <button
        class="modal-close"
        onclick="closeModal('globalModal')"
      >

        ✕

      </button>

    </div>

    <!-- BODY -->

    <div
      id="modalBody"
      class="modal-body"
    >

      Modal content

    </div>

    <!-- FOOTER -->

    <div
      id="modalFooter"
      class="modal-footer"
    >

      <button
        class="btn btn-secondary"
        onclick="closeModal('globalModal')"
      >

        Close

      </button>

    </div>

  </div>

</div>
